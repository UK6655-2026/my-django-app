{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>

    <link rel="stylesheet" href="{% static 'todos/style.css' %}">
</head>
<body>

    <div class="container">

        <h1>Todo List</h1>

        <form method="POST" class="todo-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Todoを追加</button>
        </form>

        <hr>

        <ul>
            {% for todo in todos %}
                <li>

                    <a href="{% url 'todo_toggle' todo.id %}">
                        {% if todo.completed %}
                            ☑
                        {% else %}
                            ☐
                        {% endif %}
                    </a>

                    <span class="todo-title">
                        {% if todo.completed %}
                            <s>{{ todo.title }}</s>
                        {% else %}
                            {{ todo.title }}
                        {% endif %}
                    </span>
                    
                    <span class="todo-actions">

                        <a href="{% url 'todo_edit' todo.id %}" class="edit-button">
                            編集
                        </a>

                        <a href="{% url 'todo_delete' todo.id %}" class="delete-button">
                            削除
                        </a>

                    </span>

                </li>
            {% empty %}
                <li>Todoはありません</li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
