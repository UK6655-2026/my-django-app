<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>
<body>

    <h1>Todo List</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Todoを追加</button>
    </form>

    <hr>

    <ul>
        {% for todo in todos %}
            <li>

                <a href="{% url 'todo_toggle' todo.id %}">
                    {% if todo.completed %}
                        ☑
                    {% else %}
                        ☐
                    {% endif %}
                </a>

                {% if todo.completed %}
                    <s>{{ todo.title }}</s>
                {% else %}
                    {{ todo.title }}
                {% endif %}

                <span class="todo-actions">

                    <a href="{% url 'todo_edit' todo.id %}">
                        編集
                    </a>

                    <a href="{% url 'todo_delete' todo.id %}">
                        削除
                    </a>

                </span>

            </li>
        {% empty %}
            <li>Todoはありません</li>
        {% endfor %}
    </ul>

</body>
</html>
